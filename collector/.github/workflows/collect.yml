name: 多源收集

# 一个 workflow 管所有源：内部按各源 freq 判断本轮跑哪些（--due）
# 加源/删源只改 config/registry.py，不用动这个文件
on:
  schedule:
    # 每小时触发一次，由 --due 决定每个源是否到点
    - cron: '0 * * * *'
  workflow_dispatch:        # 支持手动触发
    inputs:
      only:
        description: '只跑指定源 ID（逗号分隔，留空=按 --due）'
        required: false
        default: ''
      dry_run:
        description: 'dry-run（只抓不写）'
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 跑收集
        id: run
        env:
          # 台账放在仓根 state/（铁律 3：必须持久化）
          STATE_DIR: ${{ github.workspace }}/state
          OUT_DIR: ${{ github.workspace }}/out
          # 云端不写 Google Drive（本机同步时才写）
          WRITE_LOCAL_DISK: '0'
          # 翻译：有 key 用模型，没有走 Google 免费端点
          TRANSLATE_API: ${{ secrets.TRANSLATE_API }}
          TRANSLATE_KEY: ${{ secrets.TRANSLATE_KEY }}
          TRANSLATE_MODEL: ${{ secrets.TRANSLATE_MODEL }}
          # 需要登录态的源（瑞客、X 等）
          RUIKE_COOKIE: ${{ secrets.RUIKE_COOKIE }}
          X_COOKIE_POS: ${{ github.workspace }}/secrets/x_cookie.txt
          LD_MAX_TOPICS: '50'
          LD_LIST_PAGES: '2'
        run: |
          set -o pipefail
          if [ -n "${{ inputs.only }}" ]; then
            for sid in $(echo "${{ inputs.only }}" | tr ',' ' '); do
              python collector/run.py --source "$sid" ${{ inputs.dry_run && '--dry-run' || '' }} 2>&1 | tee -a run.log
            done
          else
            python collector/run.py --due 2>&1 | tee run.log
          fi

      - name: 把台账 commit & push 回仓（铁律 3，严禁可选）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          set -e
          git config user.name  "dsh-collector-bot"
          git config user.email "dsh-collector@users.noreply.github.com"

          # 台账是必须提交的
          git add -f state/seen_items.json
          # 运行状态（每源上次跑的时间），也要留着
          [ -f state/last_run.json ] && git add -f state/last_run.json || true
          # 产物（每日页 JSON）
          [ -d out ] && git add -f out || true
          # 运行日志
          [ -f run.log ] && git add -f run.log || true

          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: 收集台账 $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
            echo "台账已推送"
          fi

      - name: 失败也把日志传上来
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: run.log
          retention-days: 7
          if-no-files-found: ignore