name: linux.do 云资源收集

on:
  schedule:
    # 每 6 小时一轮（UTC；北京时间 = UTC+8）
    # 02:17 / 08:17 / 14:17 / 20:17 UTC = 北京 10:17 / 16:17 / 22:17 / 04:17
    - cron: '17 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      max_topics:
        description: '最多处理多少帖（默认 30）'
        required: false
        default: '50'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 恢复去重库缓存
        uses: actions/cache@v4
        with:
          path: state
          key: ld-seen-${{ github.run_id }}
          restore-keys: |
            ld-seen-

      - name: 跑采集（经 Jina 中转）
        env:
          LD_OUT_DIR: out
          LD_STATE_DIR: state
          LD_MAX_TOPICS: ${{ github.event.inputs.max_topics || '50' }}
          LD_TOPIC_DELAY: '4'
          LD_LIST_PAGES: '2'
        run: |
          echo "最多处理: $LD_MAX_TOPICS 帖"
          python3 scripts/ld_collect_jina.py

      - name: 显示结果摘要
        run: |
          echo "=== 产物 ==="
          ls -lh out/
          echo "=== 报告 ==="
          head -40 out/ld_report.md || true

      - name: 上传结果（artifact，7 天后自动过期）
        uses: actions/upload-artifact@v4
        with:
          name: ld-result-${{ github.run_number }}
          path: out/
          retention-days: 7
          if-no-files-found: warn

      - name: 保存去重库（供下轮恢复）
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: ld-seen-${{ github.run_id }}
