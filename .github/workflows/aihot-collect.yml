name: aihot 免费额度与资讯

on:
  schedule:
    # 每天 2 次（UTC 00:30 / 12:30 = 北京 08:30 / 20:30）
    # 免费额度页按 3 天核实节奏刷新、rss 每天更，2 次够
    - cron: '30 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 恢复水位线缓存
        uses: actions/cache@v4
        with:
          path: state
          key: wm-aihot-${{ github.run_id }}
          restore-keys: |
            wm-aihot-
      - name: 采集
        env:
          AH_OUT_DIR: out
          AH_MAX_ITEMS: '40'
          WM_STATE_DIR: state
          WM_DEDUP_SEED: data/dedup_seed.json
        run: python3 scripts/aihot_collect_gh.py
      - name: 显示摘要
        run: |
          ls -lh out/
          head -30 out/aihot_report.md || true
      - uses: actions/upload-artifact@v4
        with:
          name: aihot-${{ github.run_number }}
          path: out/
          retention-days: 7
      - name: 保存水位线缓存
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: wm-aihot-${{ github.run_id }}
