name: X 备选渠道探测

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 探测
        env:
          OUT_DIR: out
        run: python3 scripts/x_alt_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: x-alt-${{ github.run_number }}
          path: out/
          retention-days: 7