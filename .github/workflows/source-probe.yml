name: 信源探测

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 探测
        env:
          OUT_DIR: out
        run: python3 scripts/source_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: probe-${{ github.run_number }}
          path: out/
          retention-days: 3