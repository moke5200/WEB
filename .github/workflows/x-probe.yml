name: X 通达性探测

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 探测 X 各端点
        env:
          OUT_DIR: out
        run: python3 scripts/x_probe.py

      - name: 显示结果
        run: cat out/x_probe.md || true

      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: x-probe-${{ github.run_number }}
          path: out/
          retention-days: 7
