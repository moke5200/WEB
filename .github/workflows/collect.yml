name: 多源收集

# 一个 workflow 管所有源：内部按各源 freq 判断本轮跑哪些（--due）
# 加源/删源只改 config/registry.py，不用动这个文件
on:
  schedule:
    # 每小时触发一次，由 --due 决定每个源是否到点
    - cron: '0 * * * *'
  workflow_dispatch:          # 支持手动触发
    inputs:
      only:
        description: '只跑指定源 ID（逗号分隔，留空=按 --due）'
        required: false
        default: ''
      dry_run:
        description: 'dry-run（只抓不写）'
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write             # 台账要 commit & push 回去

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 跑收集
        env:
          # 台账放仓根 state/（铁律 3：必须持久化在仓里）
          STATE_DIR: ${{ github.workspace }}/state
          OUT_DIR: ${{ github.workspace }}/out
          # 云端不写本机磁盘
          WRITE_LOCAL_DISK: '0'
          # 翻译：有 key 用模型，没有走 Google 免费端点
          TRANSLATE_API: ${{ secrets.TRANSLATE_API }}
          TRANSLATE_KEY: ${{ secrets.TRANSLATE_KEY }}
          TRANSLATE_MODEL: ${{ secrets.TRANSLATE_MODEL }}
          # 需要登录态的源（瑞客等）
          RUIKE_COOKIE: ${{ secrets.RUIKE_COOKIE }}
          LD_MAX_TOPICS: '50'
          LD_LIST_PAGES: '2'
        run: |
          set -o pipefail
          if [ -n "${{ inputs.only }}" ]; then
            for sid in $(echo "${{ inputs.only }}" | tr ',' ' '); do
              python collector/run.py --source "$sid" ${{ inputs.dry_run && '--dry-run' || '' }} 2>&1 | tee -a run.log
            done
          else
            python collector/run.py --due 2>&1 | tee run.log
          fi

      - name: 台账 commit & push（铁律 3：强制，严禁可选）
        if: always()
        run: |
          set -e
          git config user.name  "dsh-collector-bot"
          git config user.email "dsh-collector@users.noreply.github.com"

          # 台账必须提交
          git add -f state/seen_items.json
          # 上次运行时间（调度用）
          if [ -f state/last_run.json ]; then git add -f state/last_run.json; fi
          # 产物：每日页 JSON
          if [ -d out ]; then git add -f out; fi
          # 运行日志
          if [ -f run.log ]; then git add -f run.log; fi

          if git diff --cached --quiet; then
            echo "本轮没有变化，跳过提交"
          else
            git commit -m "chore: 收集台账 $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
            echo "✅ 台账已推回仓库"
          fi

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: run.log
          retention-days: 7
          if-no-files-found: ignore